<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bertahan Rp100 Ribu</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#222;--muted:#777;--acc:#e8590c;--ok:#2f9e44;--bad:#e03131;--line:#e5dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#221f26;--text:#eee;--muted:#a09aa8;--line:#38333f}}
:root[data-theme="dark"]{--bg:#17161a;--card:#221f26;--text:#eee;--muted:#a09aa8;--line:#38333f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.w{max-width:480px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:12px;color:var(--muted)}
.val{font-size:22px;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.day{font-size:13px;color:var(--muted);margin-bottom:6px}
.q{font-size:17px;margin:0 0 8px}
.log{font-size:14px;color:var(--muted);min-height:1.5em;margin-bottom:6px}
button{display:block;width:100%;text-align:left;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center;font-weight:600}
.d{font-size:12px;color:var(--muted)}
.big{font-size:40px;text-align:center}
.c{text-align:center}

/* LAYOUT: mobile = karakter, event, pilihan. Desktop = event | karakter, pilihan di bawah */
.game{display:grid;gap:12px;grid-template-areas:"st" "ev" "op"}
.ev{grid-area:ev;margin:0;min-height:130px}
.opts{grid-area:op;display:grid;gap:8px}
.opts button{min-height:54px}
.opts.lock button{pointer-events:none;opacity:.5}
.opts.lock button.sel{opacity:1;border-color:var(--acc)}
@media(min-width:760px){.w{max-width:900px}.game{grid-template-columns:1.05fr 1fr;grid-template-areas:"ev st" "op op"}.opts{grid-template-columns:1fr 1fr}.stage{height:300px}}

/* PANGGUNG KARAKTER (tinggi tetap, tidak menggeser UI) */
.stage{grid-area:st;position:relative;height:230px;overflow:hidden;padding:0;margin:0;background:linear-gradient(#dfe9f3,#c7d7e6);cursor:pointer}
.stage[data-bg=cafe]{background:linear-gradient(#f4dcbc,#d8a874)}
.stage[data-bg=street]{background:linear-gradient(#cfe4f5,#a9bfcf)}
.stage[data-bg=home]{background:linear-gradient(#f7eedd,#e6d6b8)}
.stage[data-bg=shop]{background:linear-gradient(#ffeaa8,#f4c95d)}
.stage[data-bg=rain]{background:linear-gradient(#56667b,#2c3645)}
.stage[data-bg=rain]::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(255,255,255,.28) 9px 10px);animation:rn .35s linear infinite}
@keyframes rn{to{background-position:-18px 36px}}
#sv{width:100%;height:100%;display:block}
.cap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(20,20,25,.78);color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.cap.on{opacity:1}
.hint{position:absolute;top:8px;right:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.stage.busy .hint{opacity:1}

/* KARAKTER: wajah */
.eh,.et,.mh,.ms,.mo,.mf,.mc,.bk,.sw,.qm,.ex,.an,.hg,.bly{display:none}
.bl,.brr{transform-box:fill-box;transform-origin:center;transition:transform .25s}
svg[data-s=happy] .eo,svg[data-s=very_full] .eo,svg[data-s=tired] .eo{display:none}
svg[data-s=happy] .eh,svg[data-s=very_full] .eh{display:inline}
svg[data-s=tired] .et{display:inline}
svg[data-s=normal] .mn,svg[data-s=happy] .mh,svg[data-s=very_full] .mh,svg[data-s=sad] .ms,svg[data-s=angry] .ms,svg[data-s=hungry] .mo,svg[data-s=surprised] .mo,svg[data-s=tired] .mf,svg[data-s=confused] .mc{display:inline}
svg[data-s=happy] .bk,svg[data-s=very_full] .bk,svg[data-s=very_full] .bly,svg[data-s=tired] .sw,svg[data-s=confused] .qm,svg[data-s=surprised] .ex,svg[data-s=angry] .an,svg[data-s=hungry] .hg{display:inline}
svg[data-s=sad] .bl,svg[data-s=hungry] .bl,svg[data-s=tired] .bl{transform:rotate(-14deg)}
svg[data-s=sad] .brr,svg[data-s=hungry] .brr,svg[data-s=tired] .brr{transform:rotate(14deg)}
svg[data-s=angry] .bl{transform:rotate(16deg)}
svg[data-s=angry] .brr{transform:rotate(-16deg)}
svg[data-s=surprised] .bl,svg[data-s=surprised] .brr{transform:translateY(-4px)}
svg[data-s=confused] .brr{transform:translateY(-5px) rotate(-8deg)}
svg[data-s=surprised] .eo{transform:scale(1.3);transform-box:fill-box;transform-origin:center}
.sw{animation:dr 1.2s ease-in infinite}
@keyframes dr{from{transform:translateY(-3px);opacity:1}to{transform:translateY(8px);opacity:0}}

/* KARAKTER: pose badan */
.armL,.armR,.legL,.legR,.head{transform-box:fill-box;transition:transform .3s}
.armL,.armR,.legL,.legR{transform-origin:50% 0}
.head{transform-origin:50% 100%}
#pos{transform-origin:100px 200px;transition:transform .4s}
.bob{animation:br 2.6s ease-in-out infinite;transform-origin:100px 200px}
svg[data-s=tired] .bob{animation-duration:1.3s}
svg.sl #pos{transform:translateX(-34px)}
@keyframes br{50%{transform:translateY(-2px)}}
@keyframes bn{50%{transform:translateY(-5px)}}
@keyframes wl{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes aw{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes ea{0%,100%{transform:rotate(112deg)}50%{transform:rotate(135deg)}}
@keyframes wv{0%,100%{transform:rotate(-140deg)}50%{transform:rotate(-165deg)}}
svg[data-p=slump] .armL{transform:rotate(-28deg)}
svg[data-p=slump] .armR{transform:rotate(28deg)}
svg[data-p=slump] .head{transform:rotate(6deg) translateY(4px)}
svg[data-p=belly] .armL{transform:rotate(-55deg)}
svg[data-p=belly] .armR{transform:rotate(55deg)}
svg[data-p=carry] .armL{transform:rotate(-40deg)}
svg[data-p=carry] .armR{transform:rotate(40deg)}
svg[data-p=phone] .armL{transform:rotate(-70deg)}
svg[data-p=phone] .armR{transform:rotate(70deg)}
svg[data-p=shrug] .armL{transform:rotate(35deg)}
svg[data-p=shrug] .armR{transform:rotate(-35deg)}
svg[data-p=shrug] .head{transform:rotate(-6deg)}
svg[data-p=cheer] .armL{transform:rotate(160deg)}
svg[data-p=cheer] .armR{transform:rotate(-160deg)}
svg[data-p=cheer] .bob{animation:bn .5s infinite}
svg[data-p=eat] .armL{transform:rotate(-50deg)}
svg[data-p=eat] .armR{animation:ea .7s ease-in-out infinite}
svg[data-p=wave] .armR{animation:wv .6s ease-in-out infinite}
svg[data-p=walk] .legL{animation:wl .5s infinite alternate}
svg[data-p=walk] .legR{animation:wl .5s infinite alternate-reverse}
svg[data-p=walk] .armL{animation:aw .5s infinite alternate-reverse}
svg[data-p=walk] .armR{animation:aw .5s infinite alternate}
svg[data-p=walk] .bob{animation:bn .25s infinite}
svg[data-p=push] .bob{animation:none;transform:rotate(9deg)}
svg[data-p=push] .armL,svg[data-p=push] .armR{transform:rotate(-85deg)}
svg[data-p=push] .legL{animation:wl .9s infinite alternate}
svg[data-p=push] .legR{animation:wl .9s infinite alternate-reverse}
svg[data-p=faint] .bob{animation:none}
svg[data-p=faint] #pos{transform:translate(-84px,-16px) rotate(88deg)}
#pr text{animation:pop .3s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="w">

<script>
var $=function(i){return document.getElementById(i)};
var sv=$('sv'),pr=$('pr'),cap=$('cap'),stg=$('stage'),S,tm,skip=null,busy=0;
var rp=function(n){return 'Rp'+n.toLocaleString('id-ID')};

/* ===== KARAKTER: state & pose ===== */
function setCharacterState(s){sv.dataset.s=s}   // normal happy sad hungry tired surprised angry confused very_full
function setPose(p){sv.dataset.p=p}             // idle slump eat belly cheer walk push carry phone wave shrug faint
function show(state,prop,bg,sl){
setCharacterState(state);
setPose(state=='hungry'||state=='sad'||state=='tired'?'slump':'idle');
pr.innerHTML=prop||'';stg.dataset.bg=bg||'';sv.classList.toggle('sl',!!sl);
}

/* ===== ANIMASI ===== */
// langkah: [pose, state, properti(SVG), teks, durasi ms, geser-kiri?]
var E=function(c,x,y,s){return '<text x="'+x+'" y="'+y+'" font-size="'+s+'" text-anchor="middle">'+c+'</text>'};
var TB='<rect x="18" y="168" width="164" height="62" rx="8" fill="#a9713f"/><rect x="18" y="168" width="164" height="8" rx="4" fill="#c98a52"/>';
var MOTO=E('🏍️',150,196,78),FLAT=MOTO+E('💨',112,208,24),PH=E('📱',100,118,30);
var R=TB+E('🍚',72,166,32)+E('🍳',128,166,28),N=TB+E('🍜',100,166,38),W=TB+E('🍛',62,166,30)+E('🍗',100,166,28)+E('🥗',138,166,28);
var A={
eat_rice:[['idle','normal',R,'Siap makan…',500],['eat','normal',R,'Nyam nyam…',1300],['belly','very_full',R,'Kenyang!',800]],
eat_noodle:[['idle','normal',N,'Seruput mie…',500],['eat','normal',N,'Nyam nyam…',1100],['idle','happy',N,'Lumayan!',700]],
eat_warteg:[['idle','happy',W,'Wah, lengkap!',600],['eat','happy',W,'Makan lahap…',1700],['belly','very_full',W,'Puas banget!',900]],
fast:[['slump','hungry',TB+E('🍛',100,166,34),'Melihat makanan… tahan.',1000],['belly','hungry','','Perut keroncongan…',900],['slump','tired','','Lemas…',800]],
decline:[['wave','normal','','Tidak, terima kasih.',1000],['idle','happy','','Aman.',600]],
cafe_join:[['wave','happy',E('☕',150,112,40),'Ikut nongkrong!',900],['eat','happy',E('☕',128,84,22)+E('💬',160,60,28),'Ngobrol seru…',1400],['idle','confused',E('💸',150,100,34),'Dompet menjerit…',1000]],
money_keep:[['cheer','happy',E('💵',100,44,40)+E('✨',146,70,26)+E('✨',54,80,22),'Uang masuk!',1600]],
tire_fix:[['walk','sad',FLAT,'Menuju bengkel…',1100,1],['idle','normal',MOTO+E('🔧',112,176,32),'Ban diperbaiki…',1200,1],['cheer','happy',MOTO,'Lega, jalan lagi!',1000,1]],
tire_push:[['idle','confused',FLAT,'Cek dompet… nggak jadi.',1000,1],['push','tired',FLAT,'Dorong motor…',1800,1],['slump','tired','','Sampai rumah. Capek…',1200]],
carry_take:[['carry','normal',E('📦',100,132,44),'Angkat barang…',1100],['carry','tired',E('📦',100,134,44)+E('💦',134,62,22),'Berat…',1300],['cheer','happy',E('💵',100,44,38),'Dapat upah!',1000]],
noodle_buy:[['carry','happy',E('🍜',90,134,32)+E('🍜',118,134,32)+E('🍜',104,116,32),'Borong mie!',1500],['idle','happy',E('🍜',150,120,34),'Stok aman.',800]],
data_buy:[['phone','normal',PH,'Isi paket…',1100],['phone','happy',PH+E('📶',148,80,36),'Online lagi!',1000]],
data_wifi:[['phone','confused',PH+E('📶',148,80,30),'Nebeng wifi tetangga…',1200],['phone','tired',PH+E('🐌',148,100,30),'Sinyal lemot…',1000]],
mom_eat:[['eat','happy',TB+E('🍱',100,166,36)+E('❤️',150,70,28),'Masakan ibu!',1700],['belly','very_full',TB+E('🍱',100,166,36),'Perut bahagia.',900]],
snack_buy:[['eat','happy',E('🥟',128,84,22)+E('🍢',150,120,32),'Gorengan hangat!',1500],['belly','happy','','Enak dan murah.',800]],
contest_lose:[['phone','normal',PH,'Kirim jawaban…',1100],['shrug','sad',E('❌',148,90,30),'Tidak menang. Yah.',1200]],
contest_win:[['phone','normal',PH,'Kirim jawaban…',1100],['cheer','happy',E('🏆',100,44,44)+E('💵',148,90,30),'MENANG!',1600]],
rain_ojek:[['phone','hungry',PH,'Pesan ojek online…',1000],['idle','surprised',E('🛵',150,190,70),'Ojek datang!',1100],['eat','happy',E('🍔',128,84,22),'Kenyang, tapi mahal.',1300]],
rain_cook:[['idle','hungry',TB+E('🍲',100,166,36),'Masak seadanya…',1200],['eat','normal',TB+E('🍲',100,166,36),'Nasi dan garam. Cukup.',1300]]
};
function playAnimation(n,done){
var st=A[n],i=0,sk=0;
stg.classList.add('busy');
function next(){
if(i>=st.length){skip=null;stg.classList.remove('busy');cap.classList.remove('on');return done()}
var s=st[i++];
setPose(s[0]);setCharacterState(s[1]);pr.innerHTML=s[2];sv.classList.toggle('sl',!!s[5]);
cap.textContent=s[3];cap.classList.toggle('on',!!s[3]);
tm=setTimeout(next,s[4]*(sk?.2:1));
}
skip=function(){sk=1;clearTimeout(tm);next()};
next();
}
stg.onclick=function(){if(skip)skip()};

/* ===== DATA GAME (mekanik sama seperti sebelumnya) ===== */
var MEALS=[
{t:'🍚 Nasi + telur',m:-7000,f:40,a:'eat_rice'},
{t:'🍜 Mie instan',m:-3500,f:25,a:'eat_noodle'},
{t:'🍛 Warteg lengkap',m:-12000,f:60,a:'eat_warteg'},
{t:'🚫 Puasa hemat',m:0,f:0,a:'fast'}
];
// i = tampilan karakter saat event muncul: [state, properti, latar, geser-kiri?]; a = animasi tiap pilihan
var EV=[
{i:['normal',E('☕',150,112,44),'cafe'],q:'Teman mengajak nongkrong di kafe.',c:[{a:'cafe_join',t:'Ikut, pesan kopi',m:-15000,f:5,r:'Seru, tapi dompet menjerit.'},{a:'decline',t:'Tolak halus',m:0,f:0,r:'Aman. Kamu istirahat di rumah.'}]},
{i:['surprised',E('💵',150,110,40)+E('❗',60,62,28),'home'],q:'Kamu menemukan uang di saku jaket lama!',c:[{a:'money_keep',t:'Simpan semua',m:8000,f:0,r:'Rezeki nomplok.'}]},
{i:['sad',FLAT,'street',1],q:'Ban motor bocor di jalan.',c:[{a:'tire_fix',t:'Tambal di bengkel',m:-10000,f:-5,r:'Selesai, tapi lumayan mahal.'},{a:'tire_push',t:'Dorong sampai rumah',m:0,f:-25,r:'Hemat uang, habis tenaga.'}]},
{i:['confused',E('📦',150,150,50),'street'],q:'Tetangga menawarkan kerja bantu angkat barang.',c:[{a:'carry_take',t:'Ambil kerjaan',m:15000,f:-20,r:'Capek, tapi dapat upah.'},{a:'decline',t:'Lewatkan',m:0,f:0,r:'Kamu santai saja hari ini.'}]},
{i:['surprised',E('🍜',150,120,40)+'<text x="150" y="68" font-size="14" font-weight="700" text-anchor="middle" fill="#c92a2a">DISKON 2+1</text>','shop'],q:'Ada diskon besar: 2 bungkus mie instan gratis 1.',c:[{a:'noodle_buy',t:'Beli stok',m:-7000,f:15,r:'Stok aman untuk hari susah.'},{a:'decline',t:'Abaikan',m:0,f:0,r:'Disiplin dompet.'}]},
{i:['confused',E('📵',150,110,44),'home'],q:'Kuota internet habis.',c:[{a:'data_buy',t:'Isi paket kecil',m:-10000,f:0,r:'Bisa online lagi.'},{a:'data_wifi',t:'Pakai wifi tetangga',m:0,f:-5,r:'Sinyal lemot, sabar.'}]},
{i:['happy',E('📦',150,150,46)+E('❤️',150,100,26),'home'],q:'Ibu mengirim makanan dari kampung!',c:[{a:'mom_eat',t:'Makan sepuasnya',m:0,f:50,r:'Perut bahagia.'}]},
{i:['hungry',E('🍢',150,120,44),'street'],q:'Tergoda jajan gorengan di pinggir jalan.',c:[{a:'snack_buy',t:'Beli 3 biji',m:-3000,f:20,r:'Murah dan mengenyangkan.'},{a:'decline',t:'Tahan diri',m:0,f:0,r:'Kuat imanmu.'}]},
{i:['surprised',E('📱',150,110,36)+E('🏆',150,64,30),'home'],q:'Ada lomba kecil di grup, hadiah uang tunai.',c:[{a:'contest_lose',t:'Ikut (pakai kuota)',m:-2000,f:0,r:'Tidak menang. Yah.'},{a:'contest_win',t:'Ikut & beruntung',m:20000,f:0,r:'MENANG! Tapi ini hanya untuk yang beruntung.',lucky:1}]},
{i:['hungry',E('☔',150,70,44),'rain'],q:'Hujan deras, kamu lapar berat.',c:[{a:'rain_ojek',t:'Pesan ojek online',m:-18000,f:40,r:'Kenyang tapi mahal.'},{a:'rain_cook',t:'Masak seadanya',m:-2000,f:20,r:'Nasi dan garam. Cukup.'}]}
];

/* ===== UI ===== */
function setOpts(h){var o=$('opts');o.className='opts';o.innerHTML=h;busy=0}
function lock(b){$('opts').classList.add('lock');b.classList.add('sel')}
function hud(){
$('m').textContent=rp(S.m);
$('m').style.color=S.m<15000?'var(--bad)':'inherit';
$('f').textContent=S.f+'%';
var b=$('fb');b.style.width=S.f+'%';b.style.background=S.f<30?'var(--bad)':'var(--ok)';
}
function start(){S={d:1,m:100000,f:70,log:''};day()}
function end(win,msg){
hud();show(win?'happy':'tired','','');
setPose(win?'cheer':'faint');
pr.innerHTML=win?E('🏆',100,40,46)+E('✨',150,70,26)+E('✨',50,80,22):E('💤',150,80,30);
$('ev').innerHTML='<div class="c"><div class="big">'+(win?'🏆':'💀')+'</div><h2>'+(win?'Kamu bertahan 30 hari!':'Game over di hari '+S.d)+'</h2><p>'+msg+'</p>'+(win?'<p><b>Sisa uang: '+rp(S.m)+'</b><br>'+(S.m>=30000?'Rank: Master Hemat 🥇':S.m>=10000?'Rank: Anak Kos Tangguh 🥈':'Rank: Selamat, nyaris saja 🥉')+'</p>':'')+'</div>';
setOpts('<button class="p" onclick="start()">Main lagi</button>');
}
function day(){
hud();
show(S.f<30?'hungry':S.m<15000?'sad':'normal','','');
$('ev').innerHTML='<div class="day">Hari '+S.d+' / 30</div><div class="log">'+S.log+'</div><p class="q">Mau makan apa hari ini?</p>';
var h='';
MEALS.forEach(function(x,i){
var dis=S.m+x.m<0;
h+='<button '+(dis?'disabled':'')+' onclick="meal('+i+',this)">'+x.t+' <span class="d">('+(x.m?rp(-x.m):'gratis')+', +'+x.f+' kenyang)</span></button>';
});
setOpts(h);
}
function meal(i,b){
if(busy)return;busy=1;lock(b);
var x=MEALS[i];
playAnimation(x.a,function(){
S.m+=x.m;S.f=Math.min(100,S.f+x.f);
S.ev=EV[Math.floor(Math.random()*EV.length)];
hud();showEv();
});
}
function showEv(){
var e=S.ev,k=e.i;
show(k[0],k[1],k[2],k[3]);
$('ev').innerHTML='<div class="day">Hari '+S.d+' / 30 · Kejadian</div><div class="log"></div><p class="q">'+e.q+'</p>';
var h='';
e.c.forEach(function(c,j){
var dis=S.m+c.m<0;
h+='<button '+(dis?'disabled':'')+' onclick="ev('+j+',this)">'+c.t+' <span class="d">('+(c.m>0?'+'+rp(c.m):c.m<0?'-'+rp(-c.m):'Rp0')+')</span></button>';
});
setOpts(h);
}
function ev(j,b){
if(busy)return;busy=1;lock(b);
var c=S.ev.c[j],an=c.a;
if(c.lucky&&Math.random()<0.6){c={m:-2000,f:0,r:'Tidak menang kali ini. Kuota terbuang.'};an='contest_lose'}
playAnimation(an,function(){
S.m+=c.m;S.f=Math.max(0,Math.min(100,S.f+c.f));
S.log=c.r;hud();
if(S.f<=0){return end(false,'Kamu pingsan kelaparan monyet bodo. '+c.r)}
S.d++;
if(S.d>30){return end(true,'Kamu berhasil mengatur Rp100 ribu selama sebulan. kamu miskin dan josjis.')}
S.f-=22;
if(S.f<=0){return end(false,'Perutmu kosong dan kamu tumbang. Makan lebih rajin besok tolol!')}
day();
});
}
start();
</script>
